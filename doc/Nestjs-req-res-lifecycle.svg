<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>NestJS Request Lifecycle</title>
  <desc>Flowchart showing the NestJS request lifecycle from incoming request through middleware, guards, interceptors, pipes, route handler, and back out through interceptors and exception filters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .arr { stroke: #888; stroke-width: 1.5; fill: none; }
      .c-gray rect  { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
      .c-purple rect{ fill: #EEEDFE; stroke: #534AB7; }
      .c-blue rect  { fill: #E6F1FB; stroke: #185FA5; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-gray .th   { fill: #2C2C2A; }
      .c-teal .th   { fill: #04342C; }
      .c-purple .th { fill: #26215C; }
      .c-blue .th   { fill: #042C53; }
      .c-amber .th  { fill: #412402; }
      .c-green .th  { fill: #173404; }
      .c-coral .th  { fill: #4A1B0C; }
      .c-gray .ts   { fill: #5F5E5A; }
      .c-teal .ts   { fill: #0F6E56; }
      .c-purple .ts { fill: #534AB7; }
      .c-blue .ts   { fill: #185FA5; }
      .c-amber .ts  { fill: #854F0B; }
      .c-green .ts  { fill: #3B6D11; }
      .c-coral .ts  { fill: #993C1D; }
    </style>
  </defs>

  <!-- Incoming Request -->
  <g class="c-gray">
    <rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Incoming request</text>
  </g>
  <line x1="340" y1="64" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>

  <!-- Middleware -->
  <g class="c-teal">
    <rect x="220" y="100" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="120" text-anchor="middle" dominant-baseline="central">Middleware</text>
    <text class="ts" x="340" y="140" text-anchor="middle" dominant-baseline="central">Runs before guards, any route</text>
  </g>
  <line x1="340" y1="156" x2="340" y2="192" class="arr" marker-end="url(#arrow)"/>

  <!-- Guards -->
  <g class="c-purple">
    <rect x="220" y="192" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="212" text-anchor="middle" dominant-baseline="central">Guards</text>
    <text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">AuthGuard → RolesGuard</text>
  </g>
  <line x1="340" y1="248" x2="340" y2="284" class="arr" marker-end="url(#arrow)"/>

  <!-- Interceptors (pre) -->
  <g class="c-blue">
    <rect x="220" y="284" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="304" text-anchor="middle" dominant-baseline="central">Interceptors (pre)</text>
    <text class="ts" x="340" y="324" text-anchor="middle" dominant-baseline="central">Transform, log, timing</text>
  </g>
  <line x1="340" y1="340" x2="340" y2="376" class="arr" marker-end="url(#arrow)"/>

  <!-- Pipes -->
  <g class="c-amber">
    <rect x="220" y="376" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">Pipes</text>
    <text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">Validate and transform input</text>
  </g>
  <line x1="340" y1="432" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>

  <!-- Route Handler -->
  <g class="c-green">
    <rect x="200" y="468" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">Route handler</text>
    <text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">Controller method + service</text>
  </g>
  <line x1="340" y1="524" x2="340" y2="560" class="arr" marker-end="url(#arrow)"/>

  <!-- Interceptors (post) -->
  <g class="c-blue">
    <rect x="220" y="560" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="580" text-anchor="middle" dominant-baseline="central">Interceptors (post)</text>
    <text class="ts" x="340" y="600" text-anchor="middle" dominant-baseline="central">Transform response</text>
  </g>
  <line x1="340" y1="616" x2="340" y2="652" class="arr" marker-end="url(#arrow)"/>

  <!-- Exception Filters -->
  <g class="c-coral">
    <rect x="220" y="652" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="672" text-anchor="middle" dominant-baseline="central">Exception filters</text>
    <text class="ts" x="340" y="692" text-anchor="middle" dominant-baseline="central">Catch and format errors</text>
  </g>
  <line x1="340" y1="708" x2="340" y2="744" class="arr" marker-end="url(#arrow)"/>

  <!-- Response -->
  <g class="c-gray">
    <rect x="240" y="744" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="766" text-anchor="middle" dominant-baseline="central">Response</text>
  </g>

  <!-- Guard error path -->
  <line x1="220" y1="220" x2="120" y2="220" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
  <text class="ts" x="100" y="210" text-anchor="middle" fill="#E24B4A">401/403</text>
  <text class="ts" x="100" y="240" text-anchor="middle" fill="#E24B4A">thrown</text>

  <!-- Pipe error path -->
  <line x1="220" y1="404" x2="120" y2="404" class="arr" stroke="#E24B4A" marker-end="url(#arrow)"/>
  <text class="ts" x="100" y="394" text-anchor="middle" fill="#E24B4A">400</text>
  <text class="ts" x="100" y="418" text-anchor="middle" fill="#E24B4A">thrown</text>
</svg>
